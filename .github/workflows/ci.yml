name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Verify database report gate
        run: java scripts/VerifyDatabaseTests.java --self-test
      - name: Pre-pull integration-test images
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull mysql:9.7.1
          docker pull testcontainers/ryuk:0.14.0
      - name: Run release verification
        env:
          CI: "true"
          EXPECTED_VERSION: "1.0.0"
          ATOM_TEST_FORKS: "2"
        run: sh scripts/release-verify.sh
      - name: Build runtime image from verified artifact
        run: docker build --tag atom-crm:ci .
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
          retention-days: 14
