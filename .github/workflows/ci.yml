name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download verified Temurin JDK
        # Adoptium's API metadata truncates this CPU version; use its exact release archive.
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_x64_linux_hotspot_27.0.1.0.2_1.tar.gz' \
            --output "$RUNNER_TEMP/temurin-jdk.tar.gz"
          echo "30cb129f6cf299c852cec0feca9ea2a596d2ee9f26d8605d3a253951f6c8b20f  $RUNNER_TEMP/temurin-jdk.tar.gz" | sha256sum --check --strict -
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/temurin-jdk.tar.gz
          java-version: "27.0.1.0.2+1"
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Verify agent check process contracts
        run: bash scripts/test-agent-check.sh
      - name: Verify database report gate
        run: java scripts/VerifyDatabaseTests.java --self-test
      - name: Pre-pull integration-test images
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull mysql:26.10.0
          docker pull testcontainers/ryuk:0.14.0
      - name: Run full verification
        env:
          CI: "true"
          EXPECTED_VERSION: "1.0.0"
          ATOM_TEST_FORKS: "2"
        # full runs clean install and the database report gate once.
        run: make --no-print-directory agent-check SCOPE=full > agent-check-result.json
      - name: Build runtime image from verified artifact
        run: docker build --tag atom-crm:ci .
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            agent-check-result.json
          if-no-files-found: warn
          retention-days: 14
