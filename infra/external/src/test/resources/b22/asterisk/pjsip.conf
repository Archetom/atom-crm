[global]
type = global
user_agent = atom-crm-b22-conformance

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[agent-a]
type = endpoint
transport = transport-udp
context = b22-canary
disallow = all
allow = ulaw
aors = agent-a
direct_media = no

[agent-a]
type = aor
contact = sip:b22-sip-agent-a:5060

[agent-b]
type = endpoint
transport = transport-udp
context = b22-canary
disallow = all
allow = ulaw
aors = agent-b
direct_media = no

[agent-b]
type = aor
contact = sip:b22-sip-agent-b:5060

